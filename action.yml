name: 'Store Upload Action'
description: 'Generates goldens, reframes screenshots with texts/devices, builds AAB/IPA, and publishes to stores'
inputs:
  timezone:
    description: 'Used to set the timestamp on top of the screenshots page'
    required: false
    default: 'America/Los_Angeles'
  screenshot_background:
    description: 'Screenshot background color'
    required: true
    default: '#009688'
  screenshot_ellipse:
    description: 'Screenshot ellipse color'
    required: true
    default: '#3F51B5'
  screenshot_outline:
    description: 'Screenshot outline color'
    required: true
    default: '#009688'
  apple_key_id:
    description: 'Apple Key ID'
    required: true
  apple_p8_folder:
    description: 'Apple .p8 private key folder'
    required: true
  apple_issuer_id:
    description: 'Apple Issuer UUID'
    required: true
    default: '00000000-0000-0000-0000-000000000000'
  macos_cert:
    description: 'macOS certificate, e.g. 3rd Party Mac Developer Installer: TeamXXX (ABCDE67890)'
    required: false
  google_service_account_path:
    description: 'Google Play service account path'
    required: true
  google_track:
    description: 'Google Play track'
    required: true
    default: 'production'
  path:
    description: 'Working directory (where pubspec.yaml is)'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Auto-detect app identifiers
      id: detect-ids
      run: |
        cd "${{ github.workspace }}/${{ inputs.path }}"
        APP_NAME=$(awk -F'"' '/android:label=/{print $(NF-1)}' android/app/src/main/AndroidManifest.xml)
        if echo "$APP_NAME" | grep -qE '^\$'; then
          APP_NAME=$(awk -F'"' '/'"$(echo "$APP_NAME" | tr -d '${}')"'/{print $(NF-1);exit}' android/app/build.gradle*)
        fi
        
        echo "APP_VERSION=$(git describe --tags --always --dirty)" >>$GITHUB_ENV
        echo "APP_NAME=$APP_NAME" >>$GITHUB_ENV
        if [ -f "${{ inputs.google_service_account_path }}" ]; then 
          echo "PACKAGE_NAME=$(${{ github.action_path }}/get_application_id.awk android/app/build.gradle*)" >>$GITHUB_ENV
        fi
        
        if [ -f "${{ inputs.apple_p8_folder }}/AuthKey_${{ inputs.apple_key_id }}.p8" ]; then
          echo "IOS_BUNDLE_ID=$(${{ github.action_path }}/get_bundle_id.awk ios/Runner.xcodeproj/project.pbxproj)" >>$GITHUB_ENV
          echo "MACOS_BUNDLE_ID=$(awk '/^PRODUCT_BUNDLE_IDENTIFIER =/{print $NF}' macos/Runner/Configs/AppInfo.xcconfig)" >>$GITHUB_ENV
        fi

    - name: Run tests and generate goldens
      run: |
        cd "${{ github.workspace }}/${{ inputs.path }}"
        dart run golden_screenshot:download_apple_fonts
        flutter test --update-goldens

    - name: Set up Python
      run: |
        cd "${{ github.workspace }}/${{ inputs.path }}"
        python3 -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        pip install -r ${{ github.action_path }}/scripts/requirements.txt

    - name: Reframe screenshots
      run: |
        set -x
        cd "${{ github.workspace }}/${{ inputs.path }}"
        for dev in '${{ github.action_path }}/assets/'*.png; do
          folder="metadata/en-US/images/$(basename "$dev" | sed s/.png//)"
          for screenshot in "${folder}/"*.png; do
            .venv/bin/python '${{ github.action_path }}/scripts/reframe_screenshot.py' \
              --font '${{ github.action_path }}/assets/'*.ttf \
              --background '${{ inputs.screenshot_background }}' \
              --ellipse '${{ inputs.screenshot_ellipse }}' \
              --outline '${{ inputs.screenshot_outline }}' \
              --screenshot "$screenshot" \
              --device "$dev" \
              --text "$(cat metadata/en-US/images/$(basename "$screenshot" | sed s/.png/.txt/))"
          done
        done

    - name: Publish on stores
      run: |
        set -x
        cd "${{ github.workspace }}/${{ inputs.path }}"
        .venv/bin/python ${{ github.action_path }}/scripts/publish.py \
          --package_name          "${{ env.package_name }}" \
          --service_account_json  "${{ inputs.google_service_account_path }}" \
          --track                 "${{ inputs.google_track }}" \
          --ios_bundle_id         "${{ env.ios_bundle_id }}" \
          --macos_bundle_id       "${{ env.macos_bundle_id }}" \
          --macos_cert            "${{ inputs.macos_cert }}" \
          --key_id                "${{ inputs.apple_key_id }}" \
          --p8_folder             "${{ inputs.apple_p8_folder }}" \
          --issuer_id             "${{ inputs.apple_issuer_id }}"
